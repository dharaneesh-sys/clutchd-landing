name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # P6: GitHub Pages deploy removed — production deploy is now Netlify,
      # connected to this repo (build: npm run build, publish: dist). This
      # workflow remains as the lint+build quality gate; E2E (P11) will join.
