name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # P6: GitHub Pages deploy removed — production deploy is now Netlify,
      # connected to this repo (build: npm run build, publish: dist). This
      # workflow remains as the lint+build quality gate.      # P11: E2E smoke on the production build — serve dist/ and assert the
      # static page shape (HTTP-level only, no Playwright dependency): index +
      # legal pages 200, Netlify form marker + hidden form, GoatCounter script,
      # canonical, JSON-LD, entry/vendor assets 200, and the security headers
      # file present in dist. DOM-level assertions (skip link, sections) need a
      # real browser — this app is client-rendered; those elements exist only
      # after JS runs — so they stay in lane-c verification, deliberately not
      # added as a CI dep.
  # Wave IX-3 (PRODUCTION.md IX-3): the committed test gate. build → lint → unit
  # → e2e → smoke, all fail-closed — a broken test fails the push/PR.
  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright browser + OS deps for the production-build e2e suite
      # (playwright.config.js webServer builds dist and serves it on 4174).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  smoke:
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve dist and smoke-test
        run: |
          set -e
          npx vite preview --port 4173 --strictPort &
          SERVER_PID=$!
          # wait for the preview server to accept connections
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4173/; then break; fi
            sleep 1
          done
          HTML=$(curl -sf http://localhost:4173/)
          echo "== index status =="
          curl -sf -o /dev/null -w '%{http_code}\n' http://localhost:4173/
          # Fail-closed assertions: `grep -q x || exit 1` — a plain `&& echo`
          # would be ignored by set -e and silently pass on a broken build.
          echo "== Netlify form marker + hidden inputs =="
          echo "$HTML" | grep -q 'data-netlify="true"' || { echo "FAIL: data-netlify marker"; exit 1; }
          echo "ok: data-netlify"
          echo "$HTML" | grep -q 'netlify-honeypot="bot-field"' || { echo "FAIL: honeypot"; exit 1; }
          echo "ok: honeypot"
          echo "== GoatCounter script =="
          echo "$HTML" | grep -q 'gc.zgo.at/count.js' || { echo "FAIL: gc script"; exit 1; }
          echo "ok: script"
          echo "$HTML" | grep -q 'clutchd.goatcounter.com/count' || { echo "FAIL: gc beacon host"; exit 1; }
          echo "ok: beacon host"
          echo "== canonical / JSON-LD =="
          echo "$HTML" | grep -q 'rel="canonical"' || { echo "FAIL: canonical"; exit 1; }
          echo "ok: canonical"
          echo "$HTML" | grep -q 'application/ld+json' || { echo "FAIL: JSON-LD"; exit 1; }
          echo "ok: JSON-LD"
          echo "== legal pages =="
          for p in privacy.html terms.html; do
            curl -sf -o /dev/null -w "$p -> %{http_code}\n" http://localhost:4173/$p || { echo "FAIL: $p"; exit 1; }
          done
          echo "== entry + vendor assets (no 404s) =="
          for a in $(echo "$HTML" | grep -o 'src="/assets/[^"]*\.js"' | sed 's/src="//;s/"//' | sort -u); do
            curl -sf -o /dev/null -w "$a -> %{http_code}\n" http://localhost:4173$a || { echo "FAIL: asset $a"; exit 1; }
          done
          echo "== security headers file in dist =="
          test -f dist/_headers || { echo "FAIL: dist/_headers"; exit 1; }
          echo "ok: dist/_headers"
          # V2: SPA fallback — Netlify serves deep links via public/_redirects
          # (/* /index.html 200). Assert the file shipped + the deep link
          # resolves to the app shell (vite preview appType: 'spa' provides
          # history fallback locally; the real Netlify deep-link check happens
          # at V7 live verification).
          echo "== _redirects present in dist =="
          test -f dist/_redirects || { echo "FAIL: dist/_redirects"; exit 1; }
          echo "ok: dist/_redirects"
          echo "== deep link /marketplace =="
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/marketplace)
          test "$CODE" = "200" || { echo "FAIL: /marketplace -> $CODE"; exit 1; }
          curl -sf http://localhost:4173/marketplace | grep -q '<div id="root">' || { echo "FAIL: deep link did not serve app shell"; exit 1; }
          echo "ok: /marketplace 200 via app shell"
          kill $SERVER_PID 2>/dev/null || true
