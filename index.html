<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E29B6" />
    <!-- V1: preload Fraunces display woff2 (DESIGN.md §3, D18) — Vite
         rewrites this href to the hashed dist asset at build. font-display:
         swap (fonts-latin.css) prevents FOIT/CLS on the headline. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- P6: canonical/og/twitter URLs now target the Netlify host (deployed
         from this repo). Site created as clutchd-193 (clutchd was taken). -->
    <link rel="canonical" href="https://clutchd-193.netlify.app/" />
    <title>ClutchD: Connected automotive care</title>
    <meta
      name="description"
      content="On-demand verified mechanics, roadside help, parts marketplace, real-time tracking and digital service history: one connected automotive ecosystem, live in Coimbatore."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClutchD: Connected automotive care" />
    <meta
      property="og:description"
      content="On-demand verified mechanics, roadside help, parts marketplace, real-time tracking and digital service history: one connected automotive ecosystem, live in Coimbatore."
    />
    <meta property="og:image" content="https://clutchd-193.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ClutchD: one connected ecosystem for automotive care, live in Coimbatore."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClutchD: Connected automotive care" />
    <meta
      name="twitter:description"
      content="On-demand verified mechanics, roadside help, parts marketplace, real-time tracking and digital service history: one connected automotive ecosystem, live in Coimbatore."
    />
    <meta name="twitter:image" content="https://clutchd-193.netlify.app/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ClutchD",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "On-demand verified mechanics, roadside help, parts marketplace, real-time tracking and digital service history: one connected automotive ecosystem, live in Coimbatore.",
        "url": "https://clutchd-193.netlify.app/",
        "areaServed": { "@type": "City", "name": "Coimbatore" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    </script>
    <!-- P2: GoatCounter analytics (cookie-free, self-hostable). async so it
         never blocks rendering. CSP in public/_headers allows gc.zgo.at
         (script) + clutchd.goatcounter.com (beacon). -->
    <script
      data-goatcounter="https://clutchd.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- P1: hidden static form so Netlify detects the early-access form at
         deploy (SPA workaround — Netlify scans the built HTML). The React
         EarlyAccessForm POSTs FormData with form-name=early-access +
         honeypot bot-field; this stub is never rendered. -->
    <form name="early-access" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
